<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>功能导航</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f6f8;
      --panel: #ffffff;
      --text: #20242a;
      --muted: #667085;
      --line: #d9dee8;
      --line-strong: #b7c0cf;
      --accent: #126b5b;
      --accent-soft: #e6f2ef;
      --shadow: 0 18px 45px rgba(25, 34, 45, 0.08);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 56px 0 64px;
    }

    .hero {
      display: grid;
      gap: 10px;
      margin-bottom: 28px;
    }

    .eyebrow {
      margin: 0;
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 5vw, 52px);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .subtitle {
      max-width: 620px;
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .card {
      min-height: 168px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 1px 2px rgba(25, 34, 45, 0.04);
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    .card:hover,
    .card:focus-visible {
      transform: translateY(-3px);
      border-color: var(--line-strong);
      box-shadow: var(--shadow);
      outline: none;
    }

    .card:focus-visible {
      box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow);
    }

    .card-title {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      font-size: 19px;
      font-weight: 750;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .arrow {
      flex: 0 0 auto;
      width: 30px;
      height: 30px;
      display: inline-grid;
      place-items: center;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 18px;
      line-height: 1;
      transition: transform 160ms ease, background 160ms ease, color 160ms ease;
    }

    .card:hover .arrow,
    .card:focus-visible .arrow {
      transform: translateX(2px);
      background: var(--accent);
      color: #ffffff;
    }

    .summary {
      flex: 1;
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .path {
      display: inline-flex;
      width: fit-content;
      max-width: 100%;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--accent);
      background: #fbfcfd;
      font-size: 13px;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    @media (max-width: 860px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      .page {
        width: min(100% - 28px, 1120px);
        padding: 36px 0 44px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .card {
        min-height: 150px;
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <p class="eyebrow">Site Index</p>
      <h1>功能导航</h1>
      <p class="subtitle">当前站点的功能入口，集中跳转到可访问的工具与页面。</p>
    </header>

    <section class="grid" aria-label="功能列表">
      <a class="card" href="./canvas/">
        <strong class="card-title">
          <span>Cicada</span>
          <span class="arrow" aria-hidden="true">→</span>
        </strong>
        <p class="summary">极简网页白板，支持绘图导出。</p>
        <span class="path">./canvas/</span>
      </a>

      <a class="card" href="./json/">
        <strong class="card-title">
          <span>JSON 格式化工具</span>
          <span class="arrow" aria-hidden="true">→</span>
        </strong>
        <p class="summary">格式化、校验和压缩 JSON。</p>
        <span class="path">./json/</span>
      </a>

      <a class="card" href="./md/">
        <strong class="card-title">
          <span>Markdown URL Editor</span>
          <span class="arrow" aria-hidden="true">→</span>
        </strong>
        <p class="summary">在线编辑含 Markdown 链接的 URL。</p>
        <span class="path">./md/</span>
      </a>

      <a class="card" href="./words-pratice/">
        <strong class="card-title">
          <span>IELTS 单词练习</span>
          <span class="arrow" aria-hidden="true">→</span>
        </strong>
        <p class="summary">从远程静态词库选择 topic，或随机抽 50 题练习。</p>
        <span class="path">./words-pratice/</span>
      </a>
    </section>
  </main>
</body>
</html>
